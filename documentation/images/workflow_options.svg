<svg viewBox="0 0 1000 650" xmlns="http://www.w3.org/2000/svg" style="background:#ffffff; font-family:'Caveat',cursive;">
  <defs>
    <style>@import url('https://fonts.googleapis.com/css2?family=Caveat:wght@400;600;700&amp;display=swap');</style>
    
    <filter id="roughen" x="-5%" y="-5%" width="110%" height="110%">
      <feTurbulence type="fractalNoise" baseFrequency="0.04" numOctaves="3" result="noise"/>
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="1.5" xChannelSelector="R" yChannelSelector="G"/>
    </filter>

    <marker id="arrow-blue" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <path d="M0,0.5 L9,3.5 L0,6.5" fill="none" stroke="#2563EB" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="arrow-red" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <path d="M0,0.5 L9,3.5 L0,6.5" fill="none" stroke="#EF4444" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="arrow-green" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <path d="M0,0.5 L9,3.5 L0,6.5" fill="none" stroke="#16A34A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="arrow-orange" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <path d="M0,0.5 L9,3.5 L0,6.5" fill="none" stroke="#EA580C" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="arrow-purple" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <path d="M0,0.5 L9,3.5 L0,6.5" fill="none" stroke="#7C3AED" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <!-- 1. Entities -->
  <g filter="url(#roughen)">
    <!-- User (Blue) -->
    <circle cx="60" cy="270" r="22" fill="#2563EB1A" stroke="#2563EB" stroke-width="3"/>
    <path d="M30,340 Q60,300 90,340" fill="#2563EB1A" stroke="#2563EB" stroke-width="3"/>
    
    <!-- Tool (Red) -->
    <rect x="220" y="270" width="80" height="60" rx="4" fill="#EF44441A" stroke="#EF4444" stroke-width="3"/>
    <path d="M220,320 L300,320" fill="none" stroke="#EF4444" stroke-width="3"/>

    <!-- Baseline (Green) -->
    <ellipse cx="550" cy="110" rx="35" ry="12" fill="#16A34A1A" stroke="#16A34A" stroke-width="3"/>
    <path d="M515,110 L515,150 A35,12 0 0,0 585,150 L585,110" fill="#16A34A1A" stroke="#16A34A" stroke-width="3"/>

    <!-- Weather (Orange) -->
    <rect x="510" y="280" width="80" height="50" rx="8" fill="#EA580C1A" stroke="#EA580C" stroke-width="3"/>

    <!-- Future (Purple) -->
    <path d="M520,500 C520,470 550,460 560,480 C580,470 600,490 590,510 C610,530 580,550 560,530 C540,550 510,530 520,500" fill="#7C3AED1A" stroke="#7C3AED" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- Outputs (Cyan) -->
    <rect x="830" y="270" width="80" height="60" rx="4" fill="#0891B21A" stroke="#0891B2" stroke-width="3"/>
    <path d="M830,285 L910,285" fill="none" stroke="#0891B2" stroke-width="2"/>
    <path d="M830,300 L910,300" fill="none" stroke="#0891B2" stroke-width="2"/>
  </g>

  <!-- Entity Texts (No roughen) -->
  <text x="60" y="375" text-anchor="middle" font-size="24" font-weight="700" fill="#2563EB" transform="rotate(-1.5,60,375)">USER</text>

  <text x="260" y="365" text-anchor="middle" font-size="22" font-weight="700" fill="#EF4444" transform="rotate(1,260,365)">
    <tspan x="260" dy="0">WORLDCLIM</tspan>
    <tspan x="260" dy="22">EXTRACT R</tspan>
  </text>

  <text x="550" y="200" text-anchor="middle" font-size="22" font-weight="700" fill="#16A34A" transform="rotate(-1,550,200)">
    <tspan x="550" dy="0">HISTORICAL</tspan>
    <tspan x="550" dy="22">BASELINE</tspan>
  </text>

  <text x="550" y="370" text-anchor="middle" font-size="22" font-weight="700" fill="#EA580C" transform="rotate(1.5,550,370)">
    <tspan x="550" dy="0">HISTORICAL</tspan>
    <tspan x="550" dy="22">WEATHER</tspan>
  </text>

  <text x="550" y="585" text-anchor="middle" font-size="22" font-weight="700" fill="#7C3AED" transform="rotate(-2,550,585)">
    <tspan x="550" dy="0">FUTURE</tspan>
    <tspan x="550" dy="22">CMIP6</tspan>
  </text>

  <text x="870" y="370" text-anchor="middle" font-size="22" font-weight="700" fill="#0891B2" transform="rotate(-1,870,370)">
    <tspan x="870" dy="0">EXCEL, CSV,</tspan>
    <tspan x="870" dy="22">GEOJSON</tspan>
  </text>

  <!-- 2. Arrows (with roughen) -->
  <g filter="url(#roughen)">
    <path d="M100,310 C140,300 180,320 210,310" fill="none" stroke="#2563EB" stroke-width="3" marker-end="url(#arrow-blue)"/>
    <path d="M310,290 C380,260 420,150 500,135" fill="none" stroke="#EF4444" stroke-width="3" marker-end="url(#arrow-red)"/>
    <path d="M310,310 C380,300 420,320 500,310" fill="none" stroke="#EF4444" stroke-width="3" marker-end="url(#arrow-red)"/>
    <path d="M310,330 C380,360 420,490 500,505" fill="none" stroke="#EF4444" stroke-width="3" marker-end="url(#arrow-red)"/>
    
    <path d="M595,135 C680,160 740,240 820,285" fill="none" stroke="#16A34A" stroke-width="3" marker-end="url(#arrow-green)"/>
    <path d="M600,310 C680,300 740,320 820,310" fill="none" stroke="#EA580C" stroke-width="3" marker-end="url(#arrow-orange)"/>
    <path d="M595,505 C680,480 740,380 820,335" fill="none" stroke="#7C3AED" stroke-width="3" marker-end="url(#arrow-purple)"/>
  </g>

  <!-- 3. Numbered Circles & Text (No roughen on text) -->
  <g filter="url(#roughen)">
    <circle cx="155" cy="305" r="12" fill="white" stroke="#2563EB" stroke-width="2.5"/>
    <circle cx="410" cy="205" r="12" fill="white" stroke="#EF4444" stroke-width="2.5"/>
    <circle cx="405" cy="310" r="12" fill="white" stroke="#EF4444" stroke-width="2.5"/>
    <circle cx="410" cy="425" r="12" fill="white" stroke="#EF4444" stroke-width="2.5"/>
    <circle cx="700" cy="210" r="12" fill="white" stroke="#16A34A" stroke-width="2.5"/>
    <circle cx="710" cy="310" r="12" fill="white" stroke="#EA580C" stroke-width="2.5"/>
    <circle cx="700" cy="410" r="12" fill="white" stroke="#7C3AED" stroke-width="2.5"/>
  </g>

  <!-- Number Text (perfectly centered, dominant-baseline="central") -->
  <text x="155" y="305" text-anchor="middle" dominant-baseline="central" font-size="15" font-weight="700" fill="#2563EB">1</text>
  <text x="410" y="205" text-anchor="middle" dominant-baseline="central" font-size="15" font-weight="700" fill="#EF4444">2</text>
  <text x="405" y="310" text-anchor="middle" dominant-baseline="central" font-size="15" font-weight="700" fill="#EF4444">3</text>
  <text x="410" y="425" text-anchor="middle" dominant-baseline="central" font-size="15" font-weight="700" fill="#EF4444">4</text>
  <text x="700" y="210" text-anchor="middle" dominant-baseline="central" font-size="15" font-weight="700" fill="#16A34A">5</text>
  <text x="710" y="310" text-anchor="middle" dominant-baseline="central" font-size="15" font-weight="700" fill="#EA580C">6</text>
  <text x="700" y="410" text-anchor="middle" dominant-baseline="central" font-size="15" font-weight="700" fill="#7C3AED">7</text>

  <!-- Arrow Labels -->
  <text x="155" y="280" text-anchor="middle" font-size="16" font-weight="600" fill="#2563EB" transform="rotate(-3,155,280)">INPUT PLOTS</text>
  
  <text x="395" y="175" text-anchor="middle" font-size="16" font-weight="600" fill="#EF4444" transform="rotate(-15,395,175)">--HST_CLIMATE</text>
  <text x="405" y="280" text-anchor="middle" font-size="16" font-weight="600" fill="#EF4444" transform="rotate(-1,405,280)">--HST_WEATHER</text>
  <text x="395" y="455" text-anchor="middle" font-size="16" font-weight="600" fill="#EF4444" transform="rotate(15,395,455)">--FUTURE</text>

  <text x="700" y="180" text-anchor="middle" font-size="16" font-weight="600" fill="#16A34A" transform="rotate(12,700,180)">BIO &amp; ELEV</text>
  <text x="710" y="280" text-anchor="middle" font-size="16" font-weight="600" fill="#EA580C" transform="rotate(-1,710,280)">TIME SERIES</text>
  <text x="700" y="445" text-anchor="middle" font-size="16" font-weight="600" fill="#7C3AED" transform="rotate(-12,700,445)">PROJECTIONS</text>

</svg>
